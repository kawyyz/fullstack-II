<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseoGestión · Mis Tickets</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tickets-list { max-width: 800px; margin: 3rem auto; padding: 0 1rem; }
    .ticket-card { background: white; border: 2px dashed var(--sand); padding: 1.5rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .ticket-info h3 { margin: 0; font-family: var(--font-display); }
    .ticket-status { background: #d4edda; color: #155724; padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 4px; font-weight: 600; }
    .btn-print { padding: 0.5rem 1rem; border: 1px solid var(--ink); background: none; cursor: pointer; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="index.html">MuseoGestión</a>
    <nav class="site-nav">
      <a href="index.html" class="site-nav__link">Inicio</a>
      <a href="museos.html" class="site-nav__link">Museos</a>
      <a href="reservas.html" class="site-nav__link">Reservas</a>
      <a href="tickets.html" class="site-nav__link site-nav__link--active">Tickets</a>
      <a href="clientes.html" class="site-nav__link">Mi Perfil</a>
    </nav>
  </header>

  <main>
    <div class="tickets-list">
      <h1 style="font-family: var(--font-display); text-align: center; margin-bottom: 2rem;">Tus Entradas</h1>
      
      <div class="ticket-card">
        <div class="ticket-info">
          <h3>Museo de Arte Contemporáneo</h3>
          <p>Fecha: 25 de Septiembre, 2026 | Personas: 2</p>
          <span class="ticket-status">Pagado & Confirmado</span>
        </div>
        <button class="btn-print">Descargar PDF</button>
      </div>

      <div class="ticket-card">
        <div class="ticket-info">
          <h3>Museo de Historia Natural</h3>
          <p>Fecha: 02 de Octubre, 2026 | Personas: 1</p>
          <span class="ticket-status">Pagado & Confirmado</span>
        </div>
        <button class="btn-print">Descargar PDF</button>
      </div>
    </div>
  </main>
</body>
</html>
