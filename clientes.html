<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseoGestión · Mi Perfil</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-card { max-width: 600px; margin: 3rem auto; padding: 2rem; background: white; border: 1px solid var(--sand-line); }
    .profile-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
    .profile-avatar { width: 80px; height: 80px; background: var(--sand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .detail-row { display: flex; justify-content: space-between; padding: 0.8rem 0; border-bottom: 1px solid var(--sand-line); }
    .detail-label { font-weight: 600; color: #5b5648; }
    .btn-edit { margin-top: 1.5rem; padding: 0.6rem 1.2rem; background: var(--clay); color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="index.html">MuseoGestión</a>
    <nav class="site-nav">
      <a href="index.html" class="site-nav__link">Inicio</a>
      <a href="museos.html" class="site-nav__link">Museos</a>
      <a href="reservas.html" class="site-nav__link">Reservas</a>
      <a href="tickets.html" class="site-nav__link">Tickets</a>
      <a href="clientes.html" class="site-nav__link site-nav__link--active">Mi Perfil</a>
    </nav>
    <div class="site-header__actions"><a href="login.html" class="site-header__auth">Cerrar sesión</a></div>
  </header>

  <main>
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar">👤</div>
        <div>
          <h1 style="margin:0; font-family: var(--font-display);">Juan Pérez</h1>
          <p style="margin:0; color: #5b5648;">Cliente Premium</p>
        </div>
      </div>
      <div class="detail-row"><span class="detail-label">Correo:</span> <span>juan.perez@email.com</span></div>
      <div class="detail-row"><span class="detail-label">Teléfono:</span> <span>+56 9 1234 5678</span></div>
      <div class="detail-row"><span class="detail-label">Ciudad:</span> <span>Santiago, Chile</span></div>
      <div class="detail-row"><span class="detail-label">Rol:</span> <span>Usuario Final</span></div>
      <button class="btn-edit">Editar Información</button>
    </div>
  </main>
</body>
</html>
