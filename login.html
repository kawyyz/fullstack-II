<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseoGestión · Acceso</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container { max-width: 400px; margin: 100px auto; padding: 2rem; background: white; border: 1px solid var(--sand-line); border-radius: 8px; }
    .login-title { font-family: var(--font-display); text-align: center; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 0.7rem; border: 1px solid var(--sand-line); }
    .login-btn { width: 100%; padding: 0.8rem; background: var(--ink); color: var(--paper); border: none; cursor: pointer; font-weight: 600; }
    .login-footer { text-align: center; margin-top: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="login-title">Iniciar Sesión</h1>
    <form action="index.html">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" required placeholder="usuario@correo.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" required placeholder="********">
      </div>
      <button type="submit" class="login-btn">Ingresar</button>
    </form>
    <div class="login-footer">
      ¿No tienes cuenta? <a href="#" style="color: var(--clay)">Regístrate aquí</a>
    </div>
  </div>
</body>
</html>
